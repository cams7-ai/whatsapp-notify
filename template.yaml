AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: WhatsApp Notify on one persistent EC2 instance - preserves browser session state

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: LotoBot shared dual-stack VPC -> private IPv4 HTTP -> one persistent WhatsApp Notify EC2
    must:
      - VpcId, SubnetId and IntegrationSecurityGroupId must come from the LotoBot network procedure
      - assign no public IPv4; keep IPv6 egress for bootstrap and WhatsApp Web
      - the shared VPC must provide a CloudFormation interface endpoint with Private DNS for cfn-signal
    ref:
      - at: docs/AWS_FREE_TIER_MIGRATION_STEP_BY_STEP.md
        has: EC2 architecture and bootstrap constraints
        scope: stack

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC compartilhada criada pelo procedimento do loto-bot.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet dual-stack compartilhada criada pelo procedimento do loto-bot.
  AmiId:
    Type: AWS::EC2::Image::Id
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used only for restricted IPv6 SSH recovery access.
  AllowedSshIpv6Cidr:
    Type: String
    AllowedPattern: ^[0-9A-Fa-f:]+/128$
    ConstraintDescription: Must be one IPv6 address with the /128 prefix.
    Description: Public IPv6 /128 of the authorized SSH client.
  IntegrationSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Independently managed Security Group attached to the LotoBot consumer.
  ArtifactBucket:
    Type: String
    AllowedPattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
  ArtifactKey:
    Type: String
    AllowedPattern: ^whatsapp-notify/releases/[^\\]+\.zip$
  ArtifactSha256:
    Type: String
    AllowedPattern: ^[a-fA-F0-9]{64}$
  RootVolumeSize:
    Type: Number
    Default: 16
    MinValue: 12
    MaxValue: 30
Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: DownloadApplicationArtifact
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/whatsapp-notify/releases/*"
      Tags:
        - Key: Application
          Value: whatsapp-notify

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: exposes private HTTP to the LotoBot identity, permits recovery SSH from one IPv6 host, and allows dual-stack outbound bootstrap traffic
        must:
          - port 80 ingress only from IntegrationSecurityGroupId
          - never replace the source with a public CIDR
          - port 22 ingress only from AllowedSshIpv6Cidr /128; never use ::/0
          - keep IPv6 egress because the shared subnet has no IPv4 internet route
        mutable: change-with-constraints
    Properties:
      GroupDescription: Private HTTP access from LotoBot only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: HTTP from the LotoBot security group
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref IntegrationSecurityGroupId
        - Description: Recovery SSH over IPv6 from the authorized client
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIpv6: !Ref AllowedSshIpv6Cidr
      SecurityGroupEgress:
        - Description: HTTP outbound for Ubuntu package repositories
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: HTTPS outbound
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: DNS UDP
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - Description: DNS TCP
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - Description: HTTP over IPv6 for package repositories and redirects
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: ::/0
        - Description: HTTPS over IPv6 for AWS APIs and WhatsApp Web
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::/0
        - Description: DNS UDP over IPv6
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIpv6: ::/0
        - Description: DNS TCP over IPv6
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIpv6: ::/0
      Tags:
        - Key: Application
          Value: whatsapp-notify

  ApplicationInstance:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: persistent single-host runtime preserves the WhatsApp browser session inside the shared LotoBot network
        must:
          - assign exactly one public IPv6 and no public IPv4
          - wait for a global IPv6 address and default IPv6 route before internet-dependent bootstrap steps
          - download cfn-bootstrap from the regional S3 dual-stack endpoint
          - cfn-signal reaches the standard CloudFormation hostname through the shared interface VPC endpoint and Private DNS
          - IMDSv2 required
          - exactly one application worker
          - start through the whatsapp-notify entry point so LOG_LEVEL and the application log format take effect
          - use the supplied key pair only for restricted IPv6 SSH recovery
        mutable: change-with-constraints
        mutability:
          KeyName: review-required
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT30M
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      Ipv6AddressCount: 1
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref ApplicationSecurityGroup
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Monitoring: false
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: whatsapp-notify
        - Key: Application
          Value: whatsapp-notify
        - Key: Environment
          Value: free-tier
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          export AWS_USE_DUALSTACK_ENDPOINT=true
          exec > >(tee /var/log/whatsapp-notify-bootstrap.log | logger -t user-data -s 2>/dev/console) 2>&1

          signal_failure() {
            if [ -x /opt/cfn-bootstrap/bin/cfn-signal ]; then
              /opt/cfn-bootstrap/bin/cfn-signal --exit-code 1 \
                --stack "${AWS::StackName}" \
                --resource ApplicationInstance \
                --region "${AWS::Region}" \
                --url "https://cloudformation.${AWS::Region}.${AWS::URLSuffix}" || true
            else
              echo "cfn-signal is unavailable; bootstrap failed before aws-cfn-bootstrap was installed."
            fi
          }
          trap signal_failure ERR

          for attempt in {1..60}; do
            if ip -6 -o addr show scope global | grep -q 'inet6' && \
               ip -6 route show default | grep -q '^default'; then
              echo "Global IPv6 address and default route are ready."
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "IPv6 was not ready after 120 seconds."
              ip -6 addr show || true
              ip -6 route show || true
              exit 1
            fi

            sleep 2
          done

          apt-get update
          apt-get install -y curl nginx openssh-server python3.12 python3.12-venv python3-pip unzip
          systemctl enable --now ssh

          python3.12 -m venv /opt/cfn-bootstrap
          /opt/cfn-bootstrap/bin/pip install \
            https://s3.dualstack.${AWS::Region}.${AWS::URLSuffix}/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz

          curl --fail --location --retry 3 \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
            --output /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli
          rm -rf /tmp/aws /tmp/awscliv2.zip
          aws --version

          id whatsapp-notify >/dev/null 2>&1 || \
            useradd --system --create-home --home-dir /opt/whatsapp-notify \
              --shell /usr/sbin/nologin whatsapp-notify
          install -d -m 755 -o whatsapp-notify -g whatsapp-notify \
            /opt/whatsapp-notify/app /opt/whatsapp-notify/data
          install -d -m 700 -o whatsapp-notify -g whatsapp-notify \
            /opt/whatsapp-notify/data/.whatsapp-profile

          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          aws s3 cp \
            's3://${ArtifactBucket}/${ArtifactKey}' \
            /tmp/whatsapp-notify.zip
          echo '${ArtifactSha256}  /tmp/whatsapp-notify.zip' | sha256sum -c -
          unzip -q /tmp/whatsapp-notify.zip -d /opt/whatsapp-notify/app
          rm -f /tmp/whatsapp-notify.zip
          chown -R whatsapp-notify:whatsapp-notify /opt/whatsapp-notify/app
          cd /opt/whatsapp-notify/app
          sudo -u whatsapp-notify python3.12 -m venv .venv
          sudo -u whatsapp-notify .venv/bin/python -m pip install --upgrade pip
          sudo -u whatsapp-notify .venv/bin/pip install .
          .venv/bin/playwright install-deps chromium
          sudo -u whatsapp-notify .venv/bin/playwright install chromium

          cat >/etc/whatsapp-notify.env <<'EOF'
          WHATSAPP_TARGET_NAME=
          WHATSAPP_MESSAGE=
          WHATSAPP_HEADLESS=true
          WHATSAPP_PROFILE_DIR=/opt/whatsapp-notify/data/.whatsapp-profile
          WHATSAPP_TIMEOUT_SECONDS=60
          API_HOST=127.0.0.1
          API_PORT=8000
          LOG_LEVEL=INFO
          EOF
          chown root:root /etc/whatsapp-notify.env
          chmod 600 /etc/whatsapp-notify.env

          cat >/etc/systemd/system/whatsapp-notify.service <<'EOF'
          [Unit]
          Description=WhatsApp Notify API
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=whatsapp-notify
          Group=whatsapp-notify
          WorkingDirectory=/opt/whatsapp-notify/app
          EnvironmentFile=/etc/whatsapp-notify.env
          Environment=PYTHONPATH=/opt/whatsapp-notify/app/src
          ExecStart=/opt/whatsapp-notify/app/.venv/bin/whatsapp-notify
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=30
          KillSignal=SIGTERM
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/opt/whatsapp-notify/data

          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/etc/nginx/sites-available/whatsapp-notify <<'EOF'
          server {
              listen 80 default_server;
              server_name _;
              client_max_body_size 64k;
              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_connect_timeout 5s;
                  proxy_read_timeout 120s;
                  proxy_send_timeout 120s;
              }
          }
          EOF
          rm -f /etc/nginx/sites-enabled/default
          ln -sf /etc/nginx/sites-available/whatsapp-notify \
            /etc/nginx/sites-enabled/whatsapp-notify

          systemctl daemon-reload
          systemctl enable --now whatsapp-notify
          nginx -t
          systemctl enable --now nginx
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:8000/whatsapp/session/status; then
              echo "WhatsApp Notify health check succeeded."
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "WhatsApp Notify health check failed after 20 attempts."
              systemctl status whatsapp-notify --no-pager || true
              journalctl -u whatsapp-notify -n 100 --no-pager || true
              exit 1
            fi

            sleep 3
          done

          /opt/cfn-bootstrap/bin/cfn-signal --exit-code 0 \
            --stack "${AWS::StackName}" \
            --resource ApplicationInstance \
            --region "${AWS::Region}" \
            --url "https://cloudformation.${AWS::Region}.${AWS::URLSuffix}"
          trap - ERR

Outputs:
  InstanceId:
    Description: EC2 instance managed by the stack
    Value: !Ref ApplicationInstance
  Ipv6LookupCommand:
    Description: Command that returns the IPv6 assigned to the EC2 primary network interface
    Value: !Sub >-
      aws ec2 describe-instances --instance-ids ${ApplicationInstance} --region ${AWS::Region}
      --query "Reservations[0].Instances[0].NetworkInterfaces[0].Ipv6Addresses[0].Ipv6Address"
      --output text
  ApiUrl:
    Description: Private HTTP base URL consumed by LotoBot inside the VPC.
    Value: !Sub "http://${ApplicationInstance.PrivateDnsName}"
  SessionManagerCommand:
    Description: Command to open an SSM shell
    Value: !Sub "aws ssm start-session --target ${ApplicationInstance} --region ${AWS::Region}"
