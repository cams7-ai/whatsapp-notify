AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: WhatsApp Notify on one EC2 instance - runs the immutable application release baked into the AMI

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
  com.aws.cloudformation.Context:
    arch: Single EC2 instance booted from an immutable application AMI
    must:
      - AmiId contains the tested whatsapp-notify release, Python venv, Chromium, nginx, systemd units, AWS CLI, and cfn-signal
      - the baked systemd unit starts through the whatsapp-notify entry point so LOG_LEVEL controls application logging
      - UserData must not download, replace, or reinstall application code
      - HTTP ingress on port 80 must originate only from the LotoBot consumer security group
      - VpcId, SubnetId and IntegrationSecurityGroupId must come from the LotoBot network procedure
      - assign no public IPv4; keep IPv6 egress for WhatsApp Web
      - recovery SSH ingress must stay restricted to one authorized IPv6 /128
      - the shared VPC must provide a CloudFormation interface endpoint with Private DNS for cfn-signal
    ref:
      - at: docs/CREATE_AMI_AND_DEPLOY.md
        has: Immutable AMI build, sanitation, deploy, update, and rollback procedure
        scope: stack

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC compartilhada criada pelo procedimento do loto-bot.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subnet dual-stack compartilhada criada pelo procedimento do loto-bot.
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Preconfigured WhatsApp Notify AMI created from the base stack
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used only for restricted IPv6 SSH recovery access.
  AllowedSshIpv6Cidr:
    Type: String
    AllowedPattern: ^[0-9A-Fa-f:]+/128$
    ConstraintDescription: Must be one IPv6 address with the /128 prefix.
    Description: Public IPv6 /128 of the authorized SSH client.
  IntegrationSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Independently managed Security Group attached to the LotoBot consumer in the same VPC.
  RootVolumeSize:
    Type: Number
    Default: 16
    MinValue: 12
    MaxValue: 30
Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Application
          Value: whatsapp-notify

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: restricts private HTTP to the LotoBot identity and recovery SSH to one authorized IPv6 host
        must:
          - port 80 ingress only from IntegrationSecurityGroupId
          - never replace the source with a public CIDR
          - port 22 ingress only from AllowedSshIpv6Cidr /128; never use ::/0
        mutable: change-with-constraints
    Properties:
      GroupDescription: Private HTTP access from LotoBot only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: HTTP from the LotoBot security group
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref IntegrationSecurityGroupId
        - Description: Recovery SSH over IPv6 from the authorized client
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIpv6: !Ref AllowedSshIpv6Cidr
      SecurityGroupEgress:
        - Description: HTTP outbound for package repositories
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: HTTPS outbound
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: DNS UDP
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - Description: DNS TCP
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - Description: HTTP over IPv6 for redirects
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: ::/0
        - Description: HTTPS over IPv6 for AWS APIs and WhatsApp Web
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: ::/0
        - Description: DNS UDP over IPv6
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIpv6: ::/0
        - Description: DNS TCP over IPv6
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIpv6: ::/0
      Tags:
        - Key: Application
          Value: whatsapp-notify

  ApplicationInstance:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: boots the tested immutable release without downloading or reinstalling application code
        must:
          - AMI must be sanitized of WhatsApp session data and credentials
          - wait for a global IPv6 address and default IPv6 route before signaling CloudFormation
          - cfn-signal reaches the standard CloudFormation hostname through the shared interface VPC endpoint and Private DNS
          - IMDSv2 required
          - exactly one application worker
          - assign exactly one public IPv6 and no public IPv4
          - use the supplied key pair only for restricted IPv6 SSH recovery
        mutable: change-with-constraints
        mutability:
          ImageId: review-required
          KeyName: review-required
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT10M
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      Ipv6AddressCount: 1
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref ApplicationSecurityGroup
      CreditSpecification:
        CPUCredits: standard
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Monitoring: false
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: whatsapp-notify
        - Key: Application
          Value: whatsapp-notify
        - Key: Environment
          Value: free-tier
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          export AWS_USE_DUALSTACK_ENDPOINT=true
          exec > >(tee /var/log/whatsapp-notify-bootstrap.log | logger -t user-data -s 2>/dev/console) 2>&1

          signal_failure() {
            if [ -x /opt/cfn-bootstrap/bin/cfn-signal ]; then
              /opt/cfn-bootstrap/bin/cfn-signal --exit-code 1 \
                --stack "${AWS::StackName}" \
                --resource ApplicationInstance \
                --region "${AWS::Region}" \
                --url "https://cloudformation.${AWS::Region}.${AWS::URLSuffix}" || true
            else
              echo "cfn-signal is unavailable in the AMI."
            fi
          }
          trap signal_failure ERR

          for attempt in {1..60}; do
            if ip -6 -o addr show scope global | grep -q 'inet6' && \
               ip -6 route show default | grep -q '^default'; then
              echo "Global IPv6 address and default route are ready."
              break
            fi

            if [ "$attempt" -eq 60 ]; then
              echo "IPv6 was not ready after 120 seconds."
              ip -6 addr show || true
              ip -6 route show || true
              exit 1
            fi

            sleep 2
          done

          test -x /opt/cfn-bootstrap/bin/cfn-signal
          test -x /usr/local/bin/aws
          test -x /usr/sbin/sshd
          test -x /opt/whatsapp-notify/app/.venv/bin/python
          test -x /opt/whatsapp-notify/app/.venv/bin/uvicorn
          test -x /opt/whatsapp-notify/app/.venv/bin/playwright
          test -f /etc/systemd/system/whatsapp-notify.service
          test -f /etc/nginx/sites-available/whatsapp-notify

          systemctl daemon-reload
          systemctl enable --now ssh
          nginx -t
          systemctl enable --now nginx
          systemctl enable whatsapp-notify
          systemctl restart whatsapp-notify
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:8000/whatsapp/session/status; then
              echo "WhatsApp Notify health check succeeded."
              break
            fi

            if [ "$attempt" -eq 20 ]; then
              echo "WhatsApp Notify health check failed after 20 attempts."
              systemctl status whatsapp-notify --no-pager || true
              journalctl -u whatsapp-notify -n 100 --no-pager || true
              exit 1
            fi

            sleep 3
          done

          /opt/cfn-bootstrap/bin/cfn-signal --exit-code 0 \
            --stack "${AWS::StackName}" \
            --resource ApplicationInstance \
            --region "${AWS::Region}" \
            --url "https://cloudformation.${AWS::Region}.${AWS::URLSuffix}"
          trap - ERR

Outputs:
  InstanceId:
    Description: EC2 instance managed by the stack
    Value: !Ref ApplicationInstance
  Ipv6LookupCommand:
    Description: Command that returns the IPv6 assigned to the EC2 primary network interface
    Value: !Sub >-
      aws ec2 describe-instances --instance-ids ${ApplicationInstance} --region ${AWS::Region}
      --query "Reservations[0].Instances[0].NetworkInterfaces[0].Ipv6Addresses[0].Ipv6Address"
      --output text
  ApiUrl:
    Description: Private HTTP base URL consumed by LotoBot inside the VPC
    Value: !Sub "http://${ApplicationInstance.PrivateDnsName}"
  SessionManagerCommand:
    Description: Command to open an SSM shell
    Value: !Sub "aws ssm start-session --target ${ApplicationInstance} --region ${AWS::Region}"
